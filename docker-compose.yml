# Full local stack. See README "Run it" section.
#   docker compose up -d --build
#   open http://localhost:8080      (dashboard)
#   open http://localhost:3000      (grafana, admin/admin)
name: andon

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  timescale:
    image: timescale/timescaledb:latest-pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: andon
      POSTGRES_PASSWORD: andon
      POSTGRES_DB: andon
    volumes: ["tsdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andon -d andon"]
      interval: 5s
      timeout: 3s
      retries: 20

  plc-sim:
    build: { context: ., target: plc-sim }
    environment:
      STATIONS: "6"
      BASE_PORT: "5020"
    ports: ["5020-5025:5020-5025"]

  gateway:
    build: { context: ., target: gateway }
    environment:
      KAFKA_BROKERS: kafka:29092
      STATIONS: "station-1=plc-sim:5020,station-2=plc-sim:5021,station-3=plc-sim:5022,station-4=plc-sim:5023,station-5=plc-sim:5024,station-6=plc-sim:5025"
    ports: ["9101:9101"]
    depends_on:
      kafka: { condition: service_healthy }
      plc-sim: { condition: service_started }
    restart: unless-stopped

  processor:
    build: { context: ., target: processor }
    environment:
      KAFKA_BROKERS: kafka:29092
      DATABASE_URL: postgres://andon:andon@timescale:5432/andon
    deploy:
      replicas: 2
    depends_on:
      kafka: { condition: service_healthy }
      timescale: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    environment:
      KAFKA_BROKERS: kafka:29092
      DATABASE_URL: postgres://andon:andon@timescale:5432/andon
    ports: ["8080:8080"]
    depends_on:
      kafka: { condition: service_healthy }
      timescale: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  tsdata:
