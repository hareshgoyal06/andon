global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:9101"] }]
  - job_name: processor
    dns_sd_configs:
      - names: ["processor"]   # resolves all compose replicas
        type: A
        port: 9102
  - job_name: api
    static_configs: [{ targets: ["api:8080"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
