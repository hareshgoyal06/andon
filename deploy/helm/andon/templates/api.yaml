apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: api, metrics: "true" }
spec:
  type: {{ .Values.api.service.type }}
  selector: { app: api }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080" }
    spec:
      containers:
        - name: api
          image: {{ include "andon.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: KAFKA_BROKERS, value: "kafka-0.kafka:9092" }
            - { name: STATIC_DIR, value: /web }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: timescale, key: DATABASE_URL } }
          ports: [{ name: http, containerPort: 8080 }]
          livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
