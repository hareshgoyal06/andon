apiVersion: v1
kind: Service
metadata:
  name: processor
  labels: { app: processor, metrics: "true" }
spec:
  clusterIP: None
  selector: { app: processor }
  ports: [{ name: metrics, port: 9102 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
spec:
  replicas: {{ .Values.processor.replicas }}
  selector: { matchLabels: { app: processor } }
  template:
    metadata:
      labels: { app: processor }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9102" }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: processor
          image: {{ include "andon.image" (dict "root" . "name" "processor") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: KAFKA_BROKERS, value: "kafka-0.kafka:9092" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: timescale, key: DATABASE_URL } }
          ports: [{ name: metrics, containerPort: 9102 }]
          livenessProbe:  { httpGet: { path: /healthz, port: metrics }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz,  port: metrics }, periodSeconds: 5 }
          resources: {{ toYaml .Values.processor.resources | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: processor
spec:
  minAvailable: 1
  selector: { matchLabels: { app: processor } }
