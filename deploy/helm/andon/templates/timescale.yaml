apiVersion: v1
kind: Secret
metadata:
  name: timescale
type: Opaque
stringData:
  DATABASE_URL: postgres://{{ .Values.timescale.user }}:{{ .Values.timescale.password }}@timescale:5432/{{ .Values.timescale.database }}
---
apiVersion: v1
kind: Service
metadata:
  name: timescale
spec:
  selector: { app: timescale }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescale
spec:
  serviceName: timescale
  replicas: 1
  selector: { matchLabels: { app: timescale } }
  template:
    metadata: { labels: { app: timescale } }
    spec:
      containers:
        - name: timescale
          image: {{ .Values.timescale.image }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: {{ .Values.timescale.user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.timescale.password | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.timescale.database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.timescale.user | quote }}] }
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.timescale.storage }} } }
