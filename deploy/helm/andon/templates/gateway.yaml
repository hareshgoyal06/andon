apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app: gateway, metrics: "true" }
spec:
  selector: { app: gateway }
  ports: [{ name: metrics, port: 9101 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1   # one poller per line; scale by sharding station lists, not replicas
  strategy: { type: Recreate }
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9101" }
    spec:
      containers:
        - name: gateway
          image: {{ include "andon.image" (dict "root" . "name" "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-interval", {{ .Values.gateway.pollInterval | quote }}]
          env:
            - { name: KAFKA_BROKERS, value: "kafka-0.kafka:9092" }
            - { name: STATIONS, value: {{ include "andon.stations" . | quote }} }
          ports: [{ name: metrics, containerPort: 9101 }]
          livenessProbe: { httpGet: { path: /healthz, port: metrics }, periodSeconds: 10 }
